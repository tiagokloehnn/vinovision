<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>VinoVision AI - Buscador e Escâner de Rótulos de Vinho por Foto</title>
    <meta name="description" content="Tire uma foto do rótulo do seu vinho e receba a ficha técnica completa: vinícola, safra, notas de degustação, perfil sensorial, harmonizações gastronômicas e preço." />
    
    <!-- PWA & Mobile Web App Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#721B29" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VinoVision" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#721B29" />

    <!-- Google Fonts: Outfit (Luxury Modern) + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <!-- Auto-recovery para assets desatualizados de builds anteriores -->
    <script>
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('[VinoVision] Recurso desatualizado detectado:', e.target.src || e.target.href);
          var reloaded = sessionStorage.getItem('vv_asset_reload');
          if (!reloaded) {
            sessionStorage.setItem('vv_asset_reload', '1');
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#F8F5F0] text-[#1E1719] antialiased selection:bg-[#E8DCC4] selection:text-[#5B1420]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
