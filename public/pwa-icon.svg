<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#721B29"/>
      <stop offset="100%" stop-color="#3D0C15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A52A2A"/>
      <stop offset="100%" stop-color="#5C0D1B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle gold border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Golden Stars & Sparkles -->
  <path d="M256 70 L262 92 L284 98 L262 104 L256 126 L250 104 L228 98 L250 92 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M140 140 L144 154 L158 158 L144 162 L140 176 L136 162 L122 158 L136 154 Z" fill="url(#goldGrad)" opacity="0.8"/>
  <path d="M372 140 L376 154 L390 158 L376 162 L372 176 L368 162 L354 158 L368 154 Z" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Wine Glass Silhouette & Bowl -->
  <path d="M176 160 C176 270 240 310 248 318 L248 400 L200 400 C194 400 190 404 190 410 C190 416 194 420 200 420 L312 420 C318 420 322 416 322 410 C322 404 318 400 312 400 L264 400 L264 318 C272 310 336 270 336 160 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wine Liquid Inside -->
  <path d="M192 200 C208 224 232 232 256 232 C280 232 304 224 320 200 C320 250 286 286 256 292 C226 286 192 250 192 200 Z" 
        fill="url(#wineGrad)"/>
  
  <!-- Subtle Wine Wave Highlight -->
  <path d="M200 204 Q228 196 256 208 T312 204" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Base Plate Accent -->
  <ellipse cx="256" cy="410" rx="48" ry="4" fill="url(#goldGrad)" opacity="0.9"/>
</svg>